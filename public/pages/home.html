<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home do site</title>
    <base href="/monstroguelselnius/">
    <link rel="stylesheet" href="public/style/home.css">
</head>
<body>
    <header class="headerHome">
        <img src="public/img/logo.png" alt="" class="logo">
        <div class="divConta">
            
            <button class="botaoJogar" id="Jogar">
                <span>Jogar</span>
                <img src="public/img/icons/play.svg" alt="">
            </button>
            <button class="botaoSair" id="sair">
                <img src="public/img/icons/logout.svg" alt="">
                <span>Sair</span>
            </button>
        </div>
    </header>

    <main>
        <div>
            <h1>
                <span>Olá</span>
                <span id="nomeUsuario"></span> !
            </h1>
             <div class="atualizar">
    <div class="tituloFormulario">
        <h2>Meu perfil</h2>
        <p>Visualize e atualize suas informações pessoais.</p>
    </div>

    <form method="post" id="formAtualizar">
        <div class="campoFormulario">
            <label for="nomeUsuarioInput">Nome de usuário</label>

            <div class="formDivInput">
                <div class="inputIcone">
                    <img src="public/img/icons/person.svg" alt="">
                </div>

                <input
                    type="text"
                    id="nomeUsuarioInput"
                    name="nome"
                    class="formInput"
                    placeholder="Digite seu nome de usuário"
                    autocomplete="username"
                >
            </div>
        </div>

        <div class="campoFormulario">
            <label for="senhaInput">Senha</label>

            <div class="formDivInput">
                <div class="inputIcone">
                    <img src="public/img/icons/password.svg" alt="">
                </div>

                <input
                    type="password"
                    id="senhaInput"
                    name="senha"
                    class="formInput"
                    placeholder="***************"
                    autocomplete="new-password"
                >
            </div>
        </div>

        <div class="campoFormulario">
            <label for="senhaInput">Confirmar Senha</label>

            <div class="formDivInput">
                <div class="inputIcone">
                    <img src="public/img/icons/password.svg" alt="">
                </div>

                <input
                    type="password"
                    id="CsenhaInput"
                    name="Csenha"
                    class="formInput"
                    placeholder="***************"
                    autocomplete="new-password"
                >
            </div>
        </div>

        <div class="acoesFormulario">
            <button class="botaoExcluir" id="excluir" type="button">Excluir conta</button>
            <button type="submit" class="botaoSalvar" id="salvar">
                Salvar alterações
            </button>
        </div>
    </form>
</div>
        </div>

        <div>

        </div>
    </main>
    <script src="public/javascript/home.js"></script>
</body>
</html>
