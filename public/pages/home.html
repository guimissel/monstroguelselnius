<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <base href="/monstroguelselnius/">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/style/home.css?v=2">
</head>
<body>
    <!-- video de fundo: sem som, repete sozinho. Se nao carregar, aparece a imagem de fundo do body -->
    <video class="videoFundo" autoplay muted loop playsinline disablepictureinpicture preload="auto" aria-hidden="true">
        <source src="public/video/abertura.mp4" type="video/mp4">
    </video>

    <header class="headerHome">
        <img src="public/img/logo.png" alt="Monstroguelselnius" class="logo">
        <div class="divConta">
            <button class="botaoSair" id="sair">
                <img src="public/img/icons/logout.svg" alt="">
                <span>Sair</span>
            </button>
        </div>
    </header>

    <main>
        <section class="boasVindas">
            <p class="saudacao" id="saudacao">Olá,</p>
            <h1><span id="nomeUsuario"></span>!</h1>
            <p class="texto">Que bom te ver por aqui, treinador! A arena está pronta e o seu time está ansioso para batalhar.</p>

            <div class="companheiro" id="companheiro" hidden>
                <img id="spriteCompanheiro" alt="">
                <p id="falaCompanheiro"></p>
            </div>

            <div class="acoes">
                <a class="botaoPrincipal" href="/monstroguelselnius/jogo">Começar batalha</a>
                <a class="botaoSecundario" href="/monstroguelselnius/equipe">Equipe</a>
                <a class="botaoSecundario" href="/monstroguelselnius/inventario">Inventário</a>
                <a class="botaoSecundario" href="/monstroguelselnius/loja">Loja</a>
            </div>

            <p class="dica"><strong>Dica:</strong> <span id="dica"></span></p>
        </section>
    </main>
    <script src="public/javascript/home.js"></script>
</body>
</html>
