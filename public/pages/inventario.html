<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário</title>
<base href="/monstroguelselnius/">  
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 50px;
    background: #dac5af;
    font-family: "Pixelify Sans", monospace;
  }

  h1 {
    margin: 0 0 30px;
    font-size: 24px;
    font-weight: 400;
    color: #1f5c8a;
    text-decoration: underline;
  }

  .inventario {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 26px;
    max-width: 860px;
  }

  /* o pergaminho */
  .slot {
    --borda: polygon(
      0% 3%, 3% 3%, 3% 0%, 30% 0%, 30% 1.5%, 40% 1.5%, 40% 0%, 72% 0%,
      72% 1.5%, 80% 1.5%, 80% 0%, 97% 0%, 97% 3%, 100% 3%, 100% 30%,
      98% 30%, 98% 36%, 100% 36%, 100% 70%, 97% 70%, 97% 75%, 100% 75%,
      100% 97%, 97% 97%, 97% 100%, 70% 100%, 70% 98.5%, 40% 98.5%,
      40% 100%, 3% 100%, 3% 97%, 0% 97%, 0% 72%, 2% 72%, 2% 66%, 0% 66%,
      0% 30%, 2% 30%, 2% 25%, 0% 25%
    );
    position: relative;
    aspect-ratio: 133 / 197;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #2a1204;
    clip-path: var(--borda);
  }

  .slot::before {
    content: "";
    position: absolute;
    inset: 4px;
    background: radial-gradient(ellipse at center, #f8e1b0 50%, #efc888 78%, #d9993f 100%);
    clip-path: var(--borda);
  }

  /* o item dentro da caixa */
  .slot img {
    position: relative;
    width: 70%;
    height: 55%;
    object-fit: contain;
    image-rendering: pixelated;
  }

  /* o nome do item, embaixo da imagem */
  .slot span {
    position: relative;
    margin-top: 6px;
    padding: 0 10%;
    font-size: 14px;
    text-align: center;
    color: #3a1d08;
  }
</style>
</head>
<body>

<h1>Inventário</h1>
<button onclick="location.href='jogo'" style="margin-bottom: 24px;">Voltar ao jogo</button>

<div class="inventario">
  <!-- para colocar um item, coloque a imagem e o nome dentro da caixa:
       <div class="slot"><img src="espada.png" alt="Espada"><span>Espada</span></div> -->
  <div class="slot"><img src="public/img/potion.png" alt="Potion"><span>Poção de vida</span></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
</div>

</body>
</html>
