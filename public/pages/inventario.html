<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário</title>
<base href="/monstroguelselnius/">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/style/inventario.css?v=2">
</head>
<body>

<div class="topo">
  <h1>Inventário</h1>
  <div class="dinheiro" title="Pokédollars">
    <img src="public/img/pokedolar.gif" alt="">
    <span id="pokedolares">0</span>
  </div>
</div>

<div class="botoes">
  <a class="botao" href="jogo">Voltar ao jogo</a>
  <a class="botao" href="loja">Loja</a>
  <a class="botao" href="home">Início</a>
</div>

<div class="abas" id="abas"></div>

<p class="mensagem" id="mensagem" hidden></p>

<div class="conteudo">
  <div class="inventario" id="inventario"></div>

  <aside class="detalhes">
    <div id="detalhes">
      <p class="vazio">Clique em um item para ver os detalhes.</p>
    </div>
    <button class="botao abrir-pokebola" id="abrirTodasPokebolas" type="button" hidden>Abra todas as Pokébolas</button>
  </aside>
</div>

<dialog class="abertura-pokebola" id="aberturaPokebola" aria-labelledby="resultadoNome">
  <div class="abertura-animacao" id="aberturaAnimacao" aria-live="polite">
    <img src="public/img/pokebola.svg" alt="">
    <p>A Pokébola está abrindo...</p>
  </div>
  <section class="resultado-captura" id="resultadoCaptura" hidden>
    <p id="resultadoTipo"></p>
    <img id="resultadoImagem" alt="">
    <h2 id="resultadoNome"></h2>
    <button class="botao" id="fecharAbertura" type="button">Continuar</button>
  </section>
</dialog>

<script src="public/javascript/inventario.js?v=5"></script>
</body>
</html>
