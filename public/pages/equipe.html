<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipe</title>
<base href="/monstroguelselnius/">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/style/equipe.css?v=2">

</head>
<body>

<div class="topo">
  <h1>Escolha sua equipe</h1>
  <div class="links">
    <a class="botao" href="home">Início</a>
    <a class="botao" href="inventario">Inventário</a>
    <a class="botao" href="loja">Loja</a>
    <a class="botao" href="perfil">Perfil</a>
  </div>
</div>

<p class="explicacao" id="explicacao">Escolha 3 pokémons diferentes para batalhar.</p>
<p class="pedras" id="pedras"></p>

<div class="equipe" id="equipe"></div>

<section class="analise-equipe" aria-label="Análise de tipos da equipe">
  <div class="analise-bloco">
    <h2>Fraquezas do time</h2>
    <p class="analise-vazia" id="fraquezas-vazio">Escolha pokémons para ver as fraquezas.</p>
    <ul class="analise-lista" id="fraquezas-time"></ul>
  </div>
  <div class="analise-bloco">
    <h2>Eficaz contra</h2>
    <p class="analise-vazia" id="eficaz-vazio">Escolha pokémons para ver contra quem o time é eficaz.</p>
    <ul class="analise-lista" id="eficaz-time"></ul>
  </div>
</section>

<p class="mensagem" id="mensagem"></p>

<div class="lista" id="lista"></div>

<div class="rodape">
  <button class="botao pronto" id="pronto" disabled>Pronto!</button>
  <span id="contagem"></span>
</div>

<script src="public/javascript/equipe.js?v=8"></script>
</body>
</html>
