<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipe</title>
<base href="/monstroguelselnius/">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 50px;
    background: #dac5af;
    font-family: "Pixelify Sans", monospace;
    color: #3a1d08;
  }

  .topo {
    max-width: 1180px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 400;
    color: #1f5c8a;
    text-decoration: underline;
  }

  .links { display: flex; flex-wrap: wrap; gap: 12px; }

  .botao {
    padding: 6px 14px;
    font-family: inherit;
    font-size: 16px;
    color: #fff;
    text-decoration: none;
    background: #1a6fb5;
    border: 1px solid #0f4a80;
    border-bottom-width: 4px;
    border-radius: 4px;
    cursor: pointer;
  }
  .botao:hover:not(:disabled) { filter: brightness(1.1); }
  .botao:disabled { filter: grayscale(.8); cursor: not-allowed; }
  .botao.pronto { padding: 10px 28px; font-size: 20px; background: #2d8a3a; border-color: #1a5a24; }

  .explicacao { max-width: 1180px; margin: 0 0 20px; font-size: 18px; }

  /* os 3 lugares da equipe */
  .equipe {
    max-width: 1180px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
    margin-bottom: 14px;
  }

  .vaga {
    width: 150px;
    min-height: 170px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-align: center;
    font-family: inherit;
    font-size: 16px;
    color: #3a1d08;
    background: rgba(248, 225, 176, .5);
    border: 4px dashed #8a6a48;
    border-radius: 6px;
  }
  .vaga.cheia {
    background: radial-gradient(ellipse at center, #f8e1b0 50%, #efc888 78%, #d9993f 100%);
    border: 4px solid #2a1204;
    cursor: pointer;
  }
  .vaga img { width: 96px; height: 96px; image-rendering: pixelated; }
  .vaga .numero { font-size: 14px; color: #6b4a2a; }
  .vaga .tirar { font-size: 12px; color: #a02010; }

  .mensagem {
    max-width: 1180px;
    min-height: 26px;
    margin: 0 0 16px;
    font-size: 18px;
  }
  .mensagem.erro { color: #a02010; }
  .mensagem.ok   { color: #1d6b2a; }

  /* pokemons basicos para escolher */
  .lista {
    max-width: 1180px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }

  .carta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 10px 8px;
    font-family: inherit;
    font-size: 16px;
    color: #3a1d08;
    background: radial-gradient(ellipse at center, #f8e1b0 50%, #efc888 78%, #d9993f 100%);
    border: 4px solid #2a1204;
    border-radius: 6px;
    cursor: pointer;
  }
  .carta:hover:not(.cheio) { filter: brightness(1.05); }
  .carta img { width: 96px; height: 96px; image-rendering: pixelated; }
  .carta .nome { font-size: 18px; }
  .carta .tipos { min-height: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .carta .tipo {
    padding: 0 8px;
    font-size: 13px;
    color: #f8e1b0;
    background: #3a1d08;
    border-radius: 3px;
  }
  /* escolhido: borda azul e selo */
  .carta.escolhida { border-color: #1a6fb5; box-shadow: 0 0 0 4px #1a6fb5; position: relative; }
  .carta.escolhida::after {
    content: attr(data-posicao);
    position: absolute;
    top: -10px; right: -10px;
    width: 28px; height: 28px;
    line-height: 28px;
    text-align: center;
    color: #fff;
    background: #1a6fb5;
    border: 2px solid #0f4a80;
    border-radius: 50%;
  }
  /* ja tem 3: os outros ficam apagados */
  .carta.cheio:not(.escolhida) { opacity: .45; cursor: not-allowed; }

  .rodape { max-width: 1180px; margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }

  @media (max-width: 700px) {
    body { padding: 24px 16px; }
    .vaga { width: calc(33% - 12px); min-width: 96px; min-height: 140px; }
    .vaga img { width: 72px; height: 72px; }
  }
</style>
</head>
<body>

<div class="topo">
  <h1>Escolha sua equipe</h1>
  <div class="links">
    <a class="botao" href="home">Início</a>
    <a class="botao" href="inventario">Inventário</a>
    <a class="botao" href="loja">Loja</a>
  </div>
</div>

<p class="explicacao" id="explicacao">Escolha 3 pokémons diferentes para batalhar.</p>

<div class="equipe" id="equipe"></div>

<p class="mensagem" id="mensagem"></p>

<div class="lista" id="lista"></div>

<div class="rodape">
  <button class="botao pronto" id="pronto" disabled>Pronto!</button>
  <span id="contagem"></span>
</div>

<script src="public/javascript/equipe.js?v=3"></script>
</body>
</html>
