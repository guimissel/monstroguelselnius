<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta</title>
    <base href="/monstroguelselnius/">
    <link rel="stylesheet" href="public_html/style/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

</head>
<body>
    
    <form method="post" id="formularioSignup">
        <div class="mensagem" id="mensagem">
            <p id="textoMensagem">usuário criado com sucesso</p>
        </div>
        <div class="formCapsula">
            <div class="formDivInput">
                <img src="public_html/img/logo.png" alt="logo" class="logo">
            </div>
            <div br></div>
            <div class="formDivInput">
                <label for="usuario">Usuário</label>
                <div class="formInput">
                    <div class="inputIcone">
                        <img src="public_html/img/icons/person.svg" alt="">
                    </div>
                    <input type="text" autocomplete="nickname" name="usuario" id="usuario" placeholder="JoaoPedro67">
                </div>
            </div>
            <div br></div>
            <div class="formDivInput">
                <label for="senha">Senha</label>
                <div class="formInput">
                    <div class="inputIcone">
                        <img src="public_html/img/icons/password.svg" alt="">
                    </div>
                    <input type="password" autocomplete="new-password" name="senha" id="senha" placeholder="*************">
                </div>
            </div>
            <div br2></div>
            <div class="formDivInput">
                <button class="formSubmit" type="submit">Criar conta</button>
            </div>

            <div br></div>
            <p>Possui conta? entre <a href="/monstroguelselnius/login">aqui</a></p>
        </div>
    </form>

    <script src="public_html/javascript/signup.js"></script>
</body>
</html>
